[package]
name = "app"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Sin activar (el build por defecto, el que empaqueta el instalador NSIS):
# los datos van en app_data_dir() (%APPDATA%\es.lamarejada.farodocente\),
# comportamiento normal de una app instalada en Windows -- sobrevive a
# mover/reinstalar. Con --features portable (el .exe que se empaqueta suelto
# para el autoextraíble, ver services/db.rs::data_dir): los datos van junto
# al propio .exe, para que la copia entera quepa en un USB sin dejar rastro
# en el sistema ni compartir datos con otra copia distinta -- petición
# explícita del usuario, "la idea de una app portátil es que no guarda nada
# en sitios raros".
[features]
portable = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Solo para educastur.rs: extraer "HH:MM-HH:MM" de una etiqueta de franja
# horaria -- mismo patrón que parsePeriodRange en utils.ts (TS) y
# _PERIOD_RANGE_RE en api/app/services/educastur_sync.py (Python), las
# tres versiones tienen que coincidir en qué reconocen como rango válido.
regex = "1"
# Solo para services/backup.rs: las columnas BLOB (fotos) del volcado de
# copia de seguridad viajan como texto base64 dentro del JSON, igual que
# ya hace el backend web (Python, base64 de la librería estándar).
base64 = "0.22"
# Sincronización con el servidor (services/server_sync.rs): traer el backup cifrado desde la API
# de GitHub (ureq, cliente HTTP síncrono -- no hace falta un runtime async
# para una sola petición puntual) y descifrarlo con la clave privada age
# del usuario (mismo formato X25519 que genera `age-keygen`).
ureq = { version = "2", features = ["json", "tls"] }
age = "0.10"
