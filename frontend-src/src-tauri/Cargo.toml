[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Solo para educastur.rs: extraer "HH:MM-HH:MM" de una etiqueta de franja
# horaria -- mismo patrón que parsePeriodRange en utils.ts (TS) y
# _PERIOD_RANGE_RE en api/app/services/educastur_sync.py (Python), las
# tres versiones tienen que coincidir en qué reconocen como rango válido.
regex = "1"
