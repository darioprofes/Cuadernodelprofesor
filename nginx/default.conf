server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Por defecto nginx corta en 1 MB -- muy poco para subir un .pdf/.pptx/
    # .docx real (horario, documento de teoría, actas...) a Herramientas IA.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Igual que panel: el navegador cachea HTML/JS/CSS por heurística sin
    # Cache-Control explícito, sirviendo copias antiguas tras un despliegue
    # (crítico para sw.js: si queda cacheado, el service worker nunca se
    # actualiza). "no-cache" obliga a revalidar siempre con el servidor.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {

        proxy_pass http://profe-api:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extraer texto de un .pdf/.pptx grande (Herramientas IA) puede
        # tardar más que el timeout por defecto (60s) de nginx.
        proxy_read_timeout 120s;

    }

}
